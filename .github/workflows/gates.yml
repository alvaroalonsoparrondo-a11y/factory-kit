# Required check "gates": the three gates, on a clean machine. Human-owned.
name: gates

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Run the gates
        env:
          FACTORY_RUNTIME_CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
        run: bash harness/run-gates.sh
