# Checks the judge itself: every deliberate defect must turn the gates red. Human-owned.
name: calibrate

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["harness/**"]

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Apply each defect and expect red
        run: bash harness/calibrate.sh
