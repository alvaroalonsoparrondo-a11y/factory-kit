# Factory rules for the product owner (Sofia). Team file: commit it. Human-owned.

[agent]

persistent_facts = [
  "file:{project-root}/MISSION.md",
  "file:{project-root}/FACTORY_RULES.md",
  "file:{project-root}/harness/README.md",
  "The first ticket of the first epic is the walking skeleton: the smallest real path that CI can build, start and check end to end. It must deliver everything in the runtime contract in harness/README.md, plus one trivial real feature visible in the UI and one Playwright journey that proves it.",
  "Each story is one lap: one branch, one pull request, small enough to review in fifteen minutes. Split anything larger. The walking skeleton is the one exception: it must deliver the whole runtime contract (backend, frontend, e2e, lint and test tools, the contract test), so it is not split for size and validation does not flag it for size. Its notes say instead that generated starter files (`ng new`, Spring Initializr, the Playwright init, Maven wrapper) go in their own first commit, message starting `starter:`, with nothing written by hand in it, so reviewers can skip that commit.",
  "A ticket that needs anything FACTORY_RULES.md calls irreversible, or a change to a protected path, is marked as needing a human decision in its notes and is never handed to a lap as it is.",
  "Leave out work that contradicts MISSION.md and report the conflict to the user.",
  "Planning happens outside a lap, and a lap reads its ticket and its runtime scenario from `main`. A planning step (the initiative, its epics, slicing an epic into tickets, adding or dropping a ticket) is committed on a branch `planning/<step>` cut from `origin/main`, never on `main`. When the user says the step is done, push that branch and open a pull request with `gh`: title `planning: <step>`, and in the template's Ticket section `none: planning`. This replaces the board's 'never push' for `planning/` branches only. A human merges.",
  "Preparing one ticket that is already sliced (`refine <ref>`, answering a lap's hand-back, editing it after triage asked a question) is not a planning step and gets no pull request. Change only that ticket: its leaf file, its `tickets.toml` entry, its plan through `tickets.py mark`, and `docs/runtime/<ref>.json`. Commit on `main`, in the main checkout, after `git pull` so `main` is up to date; never in a lap's worktree or on a `story/` branch. If the session is on another branch, say so and stop. Never push: the user pushes `main` (RUNBOOK, 'Prepare the next ticket while a lap runs'). After the commit, tell the user to push, and that the ticket's triage is now stale.",
  "A container (initiative or epic) has none of the story-only frontmatter the ticket template marks 'cut on a container' (`id`, `assignee`, `hitl`) nor, on the repo store, `tracker_id`. When you write or validate a container, check its frontmatter against those notes, including containers a person wrote by hand from the template.",
  "Every [[entry]] in an epic's tickets.toml gets `touches`: the repository paths or globs the lap will change (for example `backend/src/main/java/**/link/**`, `frontend/src/app/links/**`, `e2e/tests/03-*.spec.ts`). The dispatcher runs laps in parallel only when their `touches` do not overlap; an entry without `touches` runs alone.",
  "Two entries with no `after` path between them, in either direction, must not overlap in `touches`, except files listed in the epic tickets.toml's top-level `shared = [...]` (files every lap may add to, such as `docs/openapi.yaml`; prefer append-only files there). If they would overlap, add an `after` between them or split the shared part into its own ticket. Check this whenever you slice, refine, move or validate tickets.",
  "An entry gets an optional `post_merge` list for steps a human must take after its pull request merges, each as a [[entry.post_merge]] table with `what` (the step, saying if it is a judge change and which label it needs) and `done_when` (a check the dispatcher can run; today only `file:<path>`, meaning the file is on main). Example: what = \"commit empty harness/skeleton.lock (judge change, label human-judge-change)\", done_when = \"file:harness/skeleton.lock\". Tickets that come after it wait until every check passes. Use it instead of a note when the step gates later work.",
  "Every ticket whose acceptance criteria a user can see or call gets a runtime scenario, `docs/runtime/<ref>.json`: `{\"assertions\": [{\"id\": \"AC1\", \"description\": \"...\"}]}`, one assertion per acceptance criterion, with the criterion's id. Each description says what to do against the running app (an HTTP call, or steps in the UI) and what must be seen, on a fresh app with empty data; never how the code works. An independent verifier follows it, and the lap is judged by it. Commit it to main with the ticket, before the lap starts: the lap reads it from main and may not change it. The walking skeleton gets one too. A ticket with nothing a user can see or call (pure refactoring, build changes) gets none; say so in its notes.",
  "A ticket's triage decision says whether it may go to a lap. It lives in `docs/triage/<ref>.json` on `main` and only `harness/board/triage.py` writes it. It is not the ticket's `status`: never write, change or delete a decision, and never set a `status` from one. Whenever you say which tickets are ready or next (`what's ready`, `status of`, `next`, the board), run `python harness/board/triage.py <ref> check` for each ticket you would name and show its answer beside the ticket's state. Only `fresh ready-to-implement` is ready for a lap. `none` or `stale ...` means triage it first (`triage <ref>`). `fresh ready-to-spec` or `fresh needs-info` means it waits on the questions the check prints: list them and offer `refine <ref>`. `fresh wait` means not now: give its summary. Refining a ticket makes its decision stale on its own, so after a refine, tell the user the ticket needs triage again.",
]
