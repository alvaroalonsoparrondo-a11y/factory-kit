<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory Board</title>
<style>
  :root {
    --bg: #14151b; --panel: #1a1c24; --card: #20222c; --card-hover: #252835; --line: #2b2e3b;
    --text: #e4e5ea; --muted: #868ba0; --faint: #5b6075;
    --active: #8be9fd; --pass: #50fa7b; --changes: #ffb86c; --human: #ff5555; --merged: #bd93f9;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  a { color: var(--active); }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 28px 32px 8px; }
  h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  h1 .repo { color: var(--muted); font-weight: 400; }
  .status { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .status .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--pass); margin-right: 6px; vertical-align: 1px; }
  .status.error { color: var(--human); }
  .status.error .dot { background: var(--human); }
  .banner { margin: 12px 32px 0; padding: 10px 14px; border: 1px solid var(--changes); border-radius: 8px; color: var(--changes); font-family: var(--mono); font-size: 12px; }

  .board { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; padding: 20px 32px 40px; align-items: start; }
  .col { min-width: 0; }
  .col-head { display: flex; align-items: center; gap: 8px; padding: 0 2px 10px; border-bottom: 1px solid var(--line); margin-bottom: 12px; position: relative; }
  .col-head h2 { margin: 0; font-size: 13px; font-weight: 600; }
  .col-head .who { font-size: 11px; color: var(--faint); font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .col-head .count { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .col:not(:last-child):not(:nth-last-child(2)) .col-head::after { content: "›"; position: absolute; right: -10px; top: -2px; color: var(--faint); font-size: 16px; }
  .col.human .col-head { border-bottom-color: color-mix(in srgb, var(--human) 55%, transparent); }
  .col.human h2 { color: var(--human); }
  .col.done-col h2 { color: var(--merged); }
  .empty { color: var(--faint); font-size: 12px; padding: 4px 2px; }

  .card { display: block; width: 100%; text-align: left; cursor: pointer; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 12px 10px; margin-bottom: 10px; transition: background .15s, transform .15s; }
  .card:hover { background: var(--card-hover); transform: translateY(-1px); }
  .card:focus-visible { outline: 2px solid var(--active); outline-offset: 2px; }
  .card.live { border-color: color-mix(in srgb, var(--active) 35%, var(--line)); }
  .card.human { border-color: var(--human); box-shadow: 0 0 0 1px color-mix(in srgb, var(--human) 40%, transparent), 0 8px 24px -12px color-mix(in srgb, var(--human) 60%, transparent); }
  .card.next { border-color: color-mix(in srgb, var(--pass) 45%, var(--line)); }
  .card.done { opacity: .72; }
  .card.dropped .feature { text-decoration: line-through; text-decoration-color: var(--faint); }
  .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .num { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--active); animation: pulse 1.6s ease-in-out infinite; flex: none; }
  .flag { margin-left: auto; font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; color: var(--human); }
  .flag.go { color: var(--pass); } .flag.wait { color: var(--faint); } .flag.stage { color: var(--muted); }
  .feature { font-size: 13px; line-height: 1.4; margin: 0 0 6px; }
  .links { display: flex; gap: 10px; font-family: var(--mono); font-size: 11px; flex-wrap: wrap; }
  .links a { text-decoration: none; } .links a:hover { text-decoration: underline; }
  .branch { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .checks { margin-top: 10px; display: flex; gap: 4px; }
  .chip { flex: 1; text-align: center; font-family: var(--mono); font-size: 10px; padding: 2px 0; border-radius: 4px; border: 1px dashed var(--faint); color: var(--faint); }
  .chip.running { border-style: solid; color: var(--active); animation: breathe 1.6s ease-in-out infinite; }
  .chip.green { border: 1px solid transparent; color: var(--pass); background: color-mix(in srgb, var(--pass) 14%, transparent); }
  .chip.red { border: 1px solid transparent; color: var(--human); background: color-mix(in srgb, var(--human) 16%, transparent); }
  .meta { display: flex; gap: 10px; margin-top: 8px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .meta .risk-high { color: var(--human); } .meta .risk-medium { color: var(--changes); }
  .hint { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 10.5px; color: var(--muted); line-height: 1.6; overflow-wrap: anywhere; }
  .card.human .hint { color: var(--text); }
  .triage { margin-top: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 12.5px; line-height: 1.55; max-height: 32vh; overflow-y: auto; }
  .triage .t-head { font-family: var(--mono); font-size: 11.5px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
  .triage .t-state { color: var(--text); font-weight: 600; }
  .triage .t-state.stale { color: var(--changes); }
  .triage p { margin: 6px 0 0; }
  .triage ul { margin: 4px 0 0; padding-left: 1.2em; }
  .triage .t-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; margin-top: 8px; }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { .pulse, .chip.running { animation: none; } }

  .scrim { position: fixed; inset: 0; background: rgba(5, 6, 10, .55); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(920px, 100vw); background: var(--panel); border-left: 1px solid var(--line); display: grid; grid-template-rows: auto 1fr; transform: translateX(100%); transition: transform .25s ease; visibility: hidden; }
  .open .scrim { opacity: 1; pointer-events: auto; }
  .open .drawer { transform: none; visibility: visible; }
  .d-head { padding: 20px 24px 16px; border-bottom: 1px solid var(--line); position: relative; }
  .d-head h3 { margin: 4px 40px 6px 0; font-size: 16px; font-weight: 600; line-height: 1.35; }
  .close { position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: none; cursor: pointer; color: var(--muted); font-size: 18px; line-height: 1; }
  .close:hover { color: var(--text); border-color: var(--muted); }
  .d-body { display: grid; grid-template-columns: 180px 1fr; min-height: 0; }
  .files { border-right: 1px solid var(--line); padding: 14px 10px; overflow-y: auto; }
  .file { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: 5px 8px; cursor: pointer; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .file:hover { background: var(--card); color: var(--text); }
  .file.on { background: var(--card-hover); color: var(--text); }
  .doc { overflow-y: auto; padding: 22px 28px 60px; min-width: 0; }

  .md { max-width: 700px; line-height: 1.65; }
  .md h1, .md h2, .md h3, .md h4 { line-height: 1.3; margin: 1.6em 0 .5em; }
  .md h1 { font-size: 19px; } .md h2 { font-size: 15px; } .md h3 { font-size: 14px; color: var(--muted); }
  .md > :first-child { margin-top: 0; }
  .md p, .md ul, .md ol, .md blockquote, .md pre, .md table { margin: 0 0 .9em; }
  .md ul, .md ol { padding-left: 1.3em; }
  .md li { margin: .2em 0; }
  .md li.task { list-style: none; margin-left: -1.3em; }
  .md li.task::before { content: "☐"; margin-right: .5em; color: var(--faint); }
  .md li.task.done::before { content: "☑"; color: var(--pass); }
  .md code { font-family: var(--mono); font-size: 12px; background: var(--card); padding: 1px 5px; border-radius: 4px; }
  .md pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow-x: auto; }
  .md pre code { background: none; padding: 0; }
  .md blockquote { border-left: 2px solid var(--line); padding-left: 12px; color: var(--muted); }
  .md table { border-collapse: collapse; font-size: 12.5px; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; vertical-align: top; }
  .md .front { font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: pre-wrap; }

  footer { padding: 0 32px 32px; font-family: var(--mono); font-size: 11px; color: var(--faint); display: flex; gap: 20px; flex-wrap: wrap; }

  @media (max-width: 1100px) {
    .board { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 28px; }
    .col-head::after { display: none; }
  }
  @media (max-width: 640px) {
    header { padding: 20px 16px 4px; }
    .banner { margin: 12px 16px 0; }
    .board { grid-template-columns: 1fr; padding: 16px 16px 32px; }
    footer { padding: 0 16px 24px; }
    .d-head { padding: 16px; }
    .d-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .files { border-right: 0; border-bottom: 1px solid var(--line); display: flex; gap: 4px; overflow-x: auto; padding: 8px; }
    .file { width: auto; white-space: nowrap; }
    .doc { padding: 18px 16px 48px; }
  }
</style>
</head>
<body>
<header>
  <h1>Factory board <span class="repo" id="repo"></span></h1>
  <div class="status" id="status">connecting…</div>
</header>
<div id="banner"></div>
<main class="board" id="board"></main>
<footer>
  <span>checks: gates · paths · scope</span>
  <span>reviews: BMAD passes · fix rounds · human</span>
  <span id="totals"></span>
</footer>

<div id="overlay">
  <div class="scrim" data-close></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title">
    <div class="d-head">
      <div class="num" id="d-num"></div>
      <h3 id="d-title"></h3>
      <div class="links" id="d-links"></div>
      <div id="d-triage"></div>
      <button class="close" data-close aria-label="Close">×</button>
    </div>
    <div class="d-body">
      <nav class="files" id="d-files"></nav>
      <article class="doc"><div class="md" id="d-doc"></div></article>
    </div>
  </aside>
</div>

<script>
const POLL_MS = 4000
const CHECKS = ['gates', 'protected-paths', 'scope-guard']
const CHECK_LABEL = { gates: 'gates', 'protected-paths': 'paths', 'scope-guard': 'scope' }
const COLUMNS = [
  { key: 'backlog', label: 'Backlog', who: 'triage' },
  { key: 'build', label: 'Build', who: 'lap · bmad-build' },
  { key: 'review', label: 'Review', who: 'review lenses' },
  { key: 'ci', label: 'CI', who: 'the three checks' },
  { key: 'human', label: 'Needs you', who: 'you', cls: 'human' },
  { key: 'done', label: 'Done', who: 'merged', cls: 'done-col' },
]

const $ = (id) => document.getElementById(id)
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])

let board = null
let lastRender = ''
let open = null      // { epic, id }
let openName = null
let openText = null

async function getJSON(url) {
  const res = await fetch(url, { cache: 'no-store' })
  const body = await res.json().catch(() => ({}))
  if (!res.ok) throw new Error(body.error || `${url}: HTTP ${res.status}`)
  return body
}

// ---- Board ---------------------------------------------------------------

function column(r) {
  if (r.stage === 'Done' || r.stage === 'Dropped') return 'done'
  if (r.status === 'blocked' || r.waiting_for_you || (r.needs_you && r.stage !== 'Planned')) return 'human'
  // Triaged for a human to settle first (spec it, answer it, or change or drop a ticket that waits):
  // planning ahead, while the factory builds something else.
  if (r.stage === 'Planned' && r.triage?.fresh && r.triage.state !== 'ready-to-implement') return 'human'
  if (r.stage === 'Planned') return 'backlog'
  if (r.stage === 'In CI') return 'ci'
  if (r.stage === 'In review') return 'review'
  return 'build'
}

// A lap's worktree folder, by its last path part (story-1.3); the full path is in the title and the drawer.
const treeName = (path) => String(path).split(/[\\/]/).filter(Boolean).pop() || path
const ago = (min) => (min < 1 ? 'just now' : min < 60 ? `${min} min ago` : `${Math.floor(min / 60)} h ${min % 60} min ago`)

// A prerequisite is an entry id in the same epic; show it as that ticket's ref (2 -> 1.2).
function refOf(epic, id) {
  const e = board.epics.find((x) => x.name === epic)
  return e?.rows.find((x) => x.id === id)?.ref ?? '#' + id
}

function card(r) {
  const col = column(r)
  const live = col === 'build' || col === 'review' || col === 'ci'
  const human = col === 'human'
  const next = r.status === 'needs you' && r.stage === 'Planned' && !r.waiting_for_you && !human
    && String(r.needs_you).startsWith('Start the lap')
  const flag = r.status === 'quiet' ? '<span class="flag">quiet</span>'
    : r.waiting_for_you ? `<span class="flag" title="the lap's own signal">waiting · ${esc(r.waiting_for_you.kind)}</span>`
    : human ? '<span class="flag">your call</span>'
    : next ? '<span class="flag go">next</span>'
    : r.status === 'waiting' ? `<span class="flag wait">after ${r.waiting_on.map((a) => esc(refOf(r.epic, a))).join(' ')}</span>`
    : live ? `<span class="flag stage">${esc(r.stage)}</span>` : ''
  const links = []
  if (r.pr) links.push(`<a href="${esc(r.pr.url)}" target="_blank" rel="noopener">PR #${esc(r.pr.number)}</a>`)
  if (r.branch) links.push(`<span class="branch">${esc(r.branch)}</span>`)
  if (r.worktree) links.push(`<span class="branch" title="${esc(r.worktree)}">⌂ ${esc(treeName(r.worktree))}</span>`)
  const checks = r.checks
    ? `<div class="checks">${CHECKS.map((c) => `<span class="chip ${esc(r.checks[c])}" title="${esc(c)}: ${esc(r.checks[c])}">${CHECK_LABEL[c]}</span>`).join('')}</div>` : ''
  const meta = []
  if (r.risk) meta.push(`<span class="risk-${esc(r.risk)}">${esc(r.risk)}</span>`)
  if (r.stage === 'Planned' && r.triage) {
    const t = r.triage
    const tip = t.fresh ? `${t.summary} (triaged ${t.triaged_at})` : `stale: ${t.why}`
    if (t.prepared)
      meta.push(`<span title="${esc(`the human approved its "what" in ${t.prepared}; the lap approves its own plan and never waits (${tip})`)}">prepared</span>`)
    else
      meta.push(`<span title="${esc(tip)}">triage: ${esc(t.fresh ? t.state : 'stale')}</span>`)
    if (t.fresh && t.state === 'ready-to-implement' && t.plan === 'human' && !t.prepared)
      meta.push('<span class="risk-high" title="a human approves the plan before the lap builds">plan: human</span>')
  }
  if (r.reviews) {
    const f = r.reviews.findings
    const found = f ? ` · triage log: ${f.found} found, ${f.patched} patched, ${f.deferred} deferred` : ''
    meta.push(`<span title="BMAD review passes · fix rounds · human reviews${esc(found)}">B${r.reviews.bmad} F${r.reviews.fix_rounds} H${r.reviews.human}</span>`)
  }
  if (r.human_wait) {
    const n = r.human_wait.stops
    meta.push(`<span title="time the lap said it waited for you">${n} stop${n === 1 ? '' : 's'} · ${Math.floor(r.human_wait.seconds / 60)} min</span>`)
  }
  if (live && r.last_change_minutes != null && r.quiet_minutes == null)
    meta.push(`<span title="the last file change in the lap's worktree ${esc(r.worktree)}">changed ${esc(ago(r.last_change_minutes))}</span>`)
  const say = r.needs_you && !next ? r.needs_you : r.triage_hint
  const hint = say ? `<div class="hint">${inline(say)}</div>` : ''
  return `
    <article class="card ${live ? 'live' : ''} ${human ? 'human' : ''} ${next ? 'next' : ''} ${col === 'done' ? 'done' : ''} ${r.stage === 'Dropped' ? 'dropped' : ''}"
             data-epic="${esc(r.epic)}" data-id="${esc(r.id)}" tabindex="0">
      <div class="card-top">
        ${live ? '<span class="pulse" aria-label="running"></span>' : ''}
        <span class="num">${esc(r.ref)}</span>
        ${flag}
      </div>
      <p class="feature">${esc(r.title)}</p>
      ${links.length ? `<div class="links">${links.join('')}</div>` : ''}
      ${checks}
      ${meta.length ? `<div class="meta">${meta.join('')}</div>` : ''}
      ${hint}
    </article>`
}

function render() {
  const rows = board.epics.flatMap((e) => e.rows)
  const html = COLUMNS.map((c) => {
    const cards = rows.filter((r) => column(r) === c.key)
    return `
    <section class="col ${c.cls || ''}">
      <div class="col-head"><h2>${c.label}</h2><span class="who">${c.who}</span><span class="count">${cards.length || ''}</span></div>
      ${cards.map(card).join('') || '<div class="empty">—</div>'}
    </section>`
  }).join('')
  const banner = board.problems.map((p) => `<div class="banner">${inline(p)}</div>`).join('')
  if (html + banner !== lastRender) {
    lastRender = html + banner
    $('board').innerHTML = html
    $('banner').innerHTML = banner
  }
  $('repo').textContent = board.repo
  const order = ['needs you', 'blocked', 'quiet', 'running', 'ready', 'untriaged', 'waiting', 'done', 'dropped']
  // "Start the lap" on a planned ticket is not a call to come back to this tab.
  const calls = rows.filter((r) => column(r) === 'human').length
  document.title = calls ? `(!) ${calls} · Factory Board` : 'Factory Board'
  $('totals').textContent = order.filter((s) => board.counts[s]).map((s) => `${board.counts[s]} ${s}`).join(' · ')
}

async function poll() {
  const status = $('status')
  try {
    board = await getJSON('/board.json')
    render()
    if (open) await refreshDrawer()
    const l = board.local || {}
    status.className = 'status'
    status.innerHTML = `<span class="dot"></span>main ${esc(board.main_sha)} · here: ${esc(l.branch)}${l.dirty ? ' (changes)' : ''}`
      + `${l.github ? '' : ' · no GitHub token'} · ${esc(board.built_at)}`
  } catch (err) {
    status.className = 'status error'
    status.innerHTML = `<span class="dot"></span>${esc(err.message)}`
  }
}

// ---- Drawer --------------------------------------------------------------

// Replace an element's content only when it changed, so a click never lands on a node being swapped.
function setHTML(id, html) {
  const el = $(id)
  if (el.dataset.html !== html) { el.dataset.html = html; el.innerHTML = html }
}

async function refreshDrawer() {
  const r = board.epics.flatMap((e) => e.rows).find((x) => x.epic === open.epic && x.id === open.id)
  if (!r) return
  const head = [r.ref, r.epic, r.stage, r.status]
  if (r.plan_status) head.push(`plan ${r.plan_status}`)
  if (r.triage) head.push(`triage ${r.triage.fresh ? r.triage.state : 'stale'}`)
  $('d-num').textContent = head.join(' · ')
  $('d-title').textContent = r.title
  const links = []
  if (r.pr) links.push(`<a href="${esc(r.pr.url)}" target="_blank" rel="noopener">PR #${esc(r.pr.number)}</a>`)
  if (r.branch) links.push(`<span class="branch">${esc(r.branch)}</span>`)
  if (r.worktree) links.push(`<span class="branch">worktree ${esc(r.worktree)}${
    r.last_change_minutes != null ? ` · last change ${esc(ago(r.last_change_minutes))}` : ''}</span>`)
  setHTML('d-links', links.join(''))
  setHTML('d-triage', triageBlock(r))

  const docs = await getJSON(`/docs.json?epic=${encodeURIComponent(r.epic)}&id=${encodeURIComponent(r.id)}`)
  if (!openName || !docs.some((d) => d.name === openName)) openName = docs[0]?.name || null
  setHTML('d-files', docs.map((d) =>
    `<button class="file ${d.name === openName ? 'on' : ''}" data-file="${esc(d.name)}">${esc(d.name)}</button>`).join(''))
  const text = docs.find((d) => d.name === openName)?.text ?? null
  if (text !== openText) {
    openText = text
    $('d-doc').innerHTML = text === null ? '<p class="empty">Nothing here yet.</p>' : markdown(text)
  }
}

// The ticket's triage decision: what it says, and whether it still holds.
function triageBlock(r) {
  const t = r.triage
  if (!t) return r.stage === 'Planned' && 'triaged' in r && !r.triaged
    ? '<div class="triage"><div class="t-head"><span class="t-state stale">not triaged</span></div></div>' : ''
  const list = (label, xs) => xs?.length
    ? `<div class="t-label">${label}</div><ul>${xs.map((x) => `<li>${inline(x)}</li>`).join('')}</ul>` : ''
  const head = [`<span class="t-state ${t.fresh ? '' : 'stale'}">${esc(t.state)}${t.fresh ? '' : ' · stale'}</span>`]
  if (t.prepared) head.push(`<span>plan approved by: the lap (prepared: ${esc(t.prepared)})</span>`)
  else if (t.plan) head.push(`<span>plan approved by: ${t.plan === 'human' ? 'a human' : 'the lap'}</span>`)
  if (t.triaged_at) head.push(`<span>triaged ${esc(t.triaged_at)}</span>`)
  return `<div class="triage">
    <div class="t-head">${head.join('')}</div>
    ${t.fresh ? '' : `<p>Stale: ${inline(t.why)}</p>`}
    ${t.summary ? `<p>${inline(t.summary)}</p>` : ''}
    ${list('Why', t.rationale)}
    ${list('Questions', t.questions)}
    ${t.next_step ? `<div class="t-label">Next step</div><p>${inline(t.next_step)}</p>` : ''}
  </div>`
}

async function openDrawer(epic, id) {
  open = { epic, id }
  openName = null
  openText = undefined
  document.body.classList.add('open')
  try { await refreshDrawer() } catch (err) { $('d-doc').innerHTML = `<p class="empty">${esc(err.message)}</p>` }
}

function closeDrawer() {
  open = null
  document.body.classList.remove('open')
}

document.addEventListener('click', (e) => {
  if (e.target.closest('a')) return
  const cardEl = e.target.closest('[data-epic]')
  if (cardEl) return openDrawer(cardEl.dataset.epic, cardEl.dataset.id)
  const fileEl = e.target.closest('[data-file]')
  if (fileEl) {
    openName = fileEl.dataset.file
    openText = undefined
    $('d-doc').parentElement.scrollTop = 0
    return refreshDrawer()
  }
  if (e.target.closest('[data-close]')) closeDrawer()
})
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') return closeDrawer()
  const cardEl = e.target.closest?.('[data-epic]')
  if (cardEl && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openDrawer(cardEl.dataset.epic, cardEl.dataset.id) }
})

// ---- Markdown (enough for tickets, plans and pull request text) ---------

function inline(s) {
  const codes = []
  s = esc(s).replace(/`([^`]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`)
  s = s
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]*)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`)
}

function markdown(src) {
  let lines = src.replace(/\r/g, '').split('\n')
  let html = ''
  if (lines[0] === '---') {
    const end = lines.indexOf('---', 1)
    if (end > 0) {
      html += `<pre class="front">${esc(lines.slice(1, end).join('\n'))}</pre>`
      lines = lines.slice(end + 1)
    }
  }
  const isList = (l) => /^\s*([-*+]|\d+\.)\s+/.test(l)
  const isBlockStart = (l) => /^(#{1,6}\s|```|\s*>|\||<\/?[a-z-]+[\s>])/.test(l) || isList(l)
  let i = 0
  while (i < lines.length) {
    const line = lines[i]
    if (!line.trim() || /^<\/?[a-z-]+(\s[^>]*)?>\s*$/.test(line.trim())) { i++; continue } // blank, or an HTML tag line
    if (line.startsWith('```')) {
      const body = []
      i++
      while (i < lines.length && !lines[i].startsWith('```')) body.push(lines[i++])
      i++
      html += `<pre><code>${esc(body.join('\n'))}</code></pre>`
      continue
    }
    const h = line.match(/^(#{1,6})\s+(.*)$/)
    if (h) { const n = Math.min(h[1].length, 4); html += `<h${n}>${inline(h[2])}</h${n}>`; i++; continue }
    if (/^\s*>/.test(line)) {
      const body = []
      while (i < lines.length && /^\s*>/.test(lines[i])) body.push(lines[i++].replace(/^\s*>\s?/, ''))
      html += `<blockquote>${markdown(body.join('\n'))}</blockquote>`
      continue
    }
    if (line.startsWith('|')) {
      const rows = []
      while (i < lines.length && lines[i].startsWith('|')) rows.push(lines[i++])
      const cells = (r) => r.replace(/^\||\|$/g, '').split(/(?<!\\)\|/).map((c) => inline(c.trim().replace(/\\\|/g, '|')))
      const body = rows.filter((r) => !/^\|[\s:|-]+\|$/.test(r))
      html += '<table>' + body.map((r, n) => `<tr>${cells(r).map((c) => n ? `<td>${c}</td>` : `<th>${c}</th>`).join('')}</tr>`).join('') + '</table>'
      continue
    }
    if (isList(line)) {
      const ordered = /^\s*\d+\./.test(line)
      const items = []
      while (i < lines.length && (isList(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
        const l = lines[i++]
        if (isList(l)) items.push({ indent: l.match(/^\s*/)[0].length, text: l.replace(/^\s*([-*+]|\d+\.)\s+/, '') })
        else items[items.length - 1].text += ' ' + l.trim()
      }
      const lis = items.map(({ indent, text }) => {
        const task = text.match(/^\[([ xX])\]\s+(.*)$/)
        const style = indent ? ` style="margin-left:${indent * 0.6}em"` : ''
        return task ? `<li class="task ${task[1] === ' ' ? '' : 'done'}"${style}>${inline(task[2])}</li>` : `<li${style}>${inline(text)}</li>`
      }).join('')
      html += ordered ? `<ol>${lis}</ol>` : `<ul>${lis}</ul>`
      continue
    }
    const para = []
    while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) para.push(lines[i++])
    if (!para.length) { i++; continue }
    html += `<p>${inline(para.join(' '))}</p>`
  }
  return html
}
