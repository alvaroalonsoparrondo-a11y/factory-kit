# Required checks "protected-paths" and "scope-guard". Human-owned.
#
# Uses pull_request_target on purpose: the workflow always runs as it is on the
# base branch, so a pull request cannot switch its own guard off. It never
# checks out or runs pull request code: it checks out only harness/judge/ from
# the base branch and reads the list of changed files.
#
# The patterns live in harness/judge/guards.json; harness/judge/guards.py judges.
# The factory judge (harness/judge/judge.py) uses the same two files where Actions
# is not allowed.
name: judge-guards

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  protected-paths:
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    steps:
      - name: The guard, from the base branch only
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: harness/judge
          persist-credentials: false
      - name: Fail if the pull request touches the judge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          gh api "repos/$REPO/pulls/$PR/files" --paginate -q '.[] | .filename, (.previous_filename // empty)' \
            | python3 harness/judge/guards.py protected-paths --labels "$LABELS"

  scope-guard:
    runs-on: ubuntu-latest
    steps:
      - name: The guard, from the base branch only
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: harness/judge
          persist-credentials: false
      - name: Fail on irreversible kinds of change
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          gh api "repos/$REPO/pulls/$PR/files" --paginate -q '.[].filename' \
            | python3 harness/judge/guards.py scope-guard --labels "$LABELS"
