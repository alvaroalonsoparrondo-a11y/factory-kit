<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Factory Kit Lap Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap">
<style>
/* Layout: one wide swimlane figure as the spine, then three short reference blocks underneath. */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --lane: #eceff4;
  --fg: #1b2230;
  --muted: #5b6577;
  --line: #c9d0db;
  --judge: #b4580a;      /* the judge: CI, the part the agent cannot change */
  --red: #b42318;
  --green: #217a45;
  --sans: "IBM Plex Sans", system-ui, sans-serif;
  --cond: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161d; --surface: #1a2029; --lane: #1f2631; --fg: #e4e8ef; --muted: #98a2b3;
    --line: #3a4453; --judge: #f0a35e; --red: #f2786b; --green: #5fc58a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161d; --surface: #1a2029; --lane: #1f2631; --fg: #e4e8ef; --muted: #98a2b3;
  --line: #3a4453; --judge: #f0a35e; --red: #f2786b; --green: #5fc58a; color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--sans); }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 40px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 40px; }
.wrap > * { min-width: 0; }
header { display: grid; gap: 10px; max-width: 70ch; }
.eyebrow { font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--judge); }
h1 { font: 600 clamp(28px, 4vw, 40px)/1.1 var(--cond); margin: 0; text-wrap: balance; }
h2 { font: 600 20px/1.2 var(--cond); margin: 0 0 12px; text-wrap: balance; }
p { margin: 0; }
.lede { color: var(--muted); font-size: 17px; }
code { font: 13px var(--mono); }
figure { margin: 0; display: grid; gap: 12px; }
.scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.scroll svg { display: block; width: 100%; min-width: 980px; height: auto; color: var(--fg); }
figcaption { color: var(--muted); max-width: 80ch; font-size: 14px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 28px; }
.cols > section { min-width: 0; }
ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.who { font: 600 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 6px; }
.who.h { color: var(--fg); } .who.a { color: var(--muted); } .who.j { color: var(--judge); }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 620px; font-size: 14px; }
th, td { text-align: left; padding: 9px 12px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 600 12px var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
td:last-child { font-family: var(--mono); font-size: 13px; }
.note { border-left: 3px solid var(--judge); padding: 4px 0 4px 14px; max-width: 80ch; color: var(--muted); }
</style>
<style>body { margin: 0; }</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">factory-kit · BMAD v7 · Kiro CLI</div>
    <h1>A software factory is a repeatable loop around software work.</h1>
    <p class="lede">You plan the release, the factory builds it, you test it in staging. What you find there feeds the next plan, and the loop runs again.</p>
  </header>

            <text x="800" y="56">You test it in staging</text>
          </g>

            <text x="160" y="76">PRD · MISSION.md · tickets</text>
            <text x="480" y="76">one lap per ticket, CI-checked</text>
            <text x="800" y="76">a human step, outside the kit</text>
          </g>
          <g font-family="IBM Plex Mono, monospace" font-size="10.5" fill="var(--muted)">
            <text x="320" y="54">tickets</text>
            <text x="640" y="54">merged</text>
            <text x="480" y="166">what you find becomes the next tickets</text>
          </g>
        </g>
        <g fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ar2)">
          <path d="M280 66 H358"/>
          <path d="M600 66 H678"/>
          <path d="M800 96 V150 H160 V98"/>
        </g>
      </svg>
    </div>
    <figcaption>The release loop. This kit is the middle box: rules the agent works under, a lap it follows, and a judge it is not allowed to edit. Planning is interactive with BMAD, and deploying to staging stays with a human, because the factory rules treat deployment as irreversible.</figcaption>
  </figure>
