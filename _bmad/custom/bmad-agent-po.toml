# Factory rules for the product owner (Sofia). Team file: commit it. Human-owned.

[agent]

persistent_facts = [
  "file:{project-root}/MISSION.md",
  "file:{project-root}/FACTORY_RULES.md",
  "file:{project-root}/harness/README.md",
  "The first ticket of the first epic is the walking skeleton: the smallest real path that CI can build, start and check end to end. It must deliver everything in the runtime contract in harness/README.md, plus one trivial real feature visible in the UI and one Playwright journey that proves it.",
  "Each story is one lap: one branch, one pull request, small enough to review in fifteen minutes. Split anything larger.",
  "A ticket that needs anything FACTORY_RULES.md calls irreversible, or a change to a protected path, is marked as needing a human decision in its notes and is never handed to a lap as it is.",
  "Leave out work that contradicts MISSION.md and report the conflict to the user.",
  "Every [[entry]] in an epic's tickets.toml gets `touches`: the repository paths or globs the lap will change (for example `backend/src/main/java/**/link/**`, `frontend/src/app/links/**`, `e2e/tests/03-*.spec.ts`). The dispatcher runs laps in parallel only when their `touches` do not overlap; an entry without `touches` runs alone.",
  "Two entries with no `after` path between them, in either direction, must not overlap in `touches`, except files listed in the epic tickets.toml's top-level `shared = [...]` (files every lap may add to, such as `docs/openapi.yaml`; prefer append-only files there). If they would overlap, add an `after` between them or split the shared part into its own ticket. Check this whenever you slice, refine, move or validate tickets.",
  "An entry gets an optional `post_merge` list for steps a human must take after its pull request merges, each as a [[entry.post_merge]] table with `what` (the step, saying if it is a judge change and which label it needs) and `done_when` (a check the dispatcher can run; today only `file:<path>`, meaning the file is on main). Example: what = \"commit empty harness/skeleton.lock (judge change, label human-judge-change)\", done_when = \"file:harness/skeleton.lock\". Tickets that come after it wait until every check passes. Use it instead of a note when the step gates later work.",
]
